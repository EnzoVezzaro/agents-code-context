# Provider Allowlist — PR AI Contribution Verification
#
# Structure:
#   providers:
#     <provider>:
#       free_api_access: <bool>       # provider-level default
#       models:
#         (all)                        # optional: applies to all models
#         free-model:
#           - model-name
#         paid-model:
#           - model-name
#   harnesses:
#     <name>:
#       allowed: <bool>

providers:
  google:
    free_api_access: true
    models:
      (all):
      free-model:
        - gemini-3.5-flash
        - gemini-2.5-flash
      paid-model:
        - gemini-3.5-pro
        - gemini-2.5-pro

  openai:
    free_api_access: false
    models:
      paid-model:
        - gpt-5.6
        - gpt-4o

  anthropic:
    free_api_access: false
    models:
      paid-model:
        - claude-sonnet-4
        - claude-opus-4

  nvidia:
    free_api_access: false
    models:
      paid-model:
        - nvidia/nemotron-3-nano-30b-a3b

  openrouter:
    free_api_access: true
    models:
      (all):

harnesses:
  freebuff:
    allowed: true
  opencode:
    allowed: true
  claude-code:
    allowed: true
  cursor:
    allowed: true
  codex:
    allowed: true
  gemini:
    allowed: true
  vscode:
    allowed: true
  windsurf:
    allowed: true
