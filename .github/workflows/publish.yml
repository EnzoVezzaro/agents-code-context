name: Publish to npm

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Get package version
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          # Detect pre-release versions (e.g., 0.6.7-dev, 1.0.0-beta.1)
          if echo "$VERSION" | grep -qE '-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "npm_tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if version is already published
        id: npm
        run: |
          CURRENT=$(npm view "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" version 2>/dev/null || echo "")
          LATEST=$(npm view "${{ steps.pkg.outputs.name }}" version 2>/dev/null || echo "")
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Package: ${{ steps.pkg.outputs.name }}"
          echo "Version in package.json: ${{ steps.pkg.outputs.version }}"
          echo "Latest on npm: $LATEST"

      - name: Install dependencies
        if: steps.npm.outputs.current == ''
        run: npm install

      - name: Run tests
        if: steps.npm.outputs.current == ''
        run: node --test test/*.test.js

      - name: Consistency checks
        if: steps.npm.outputs.current == ''
        run: |
          npm run check:versions
          npm run check:skill-copies

      - name: Publish to npm
        if: steps.npm.outputs.current == ''
        run: npm publish --tag ${{ steps.pkg.outputs.npm_tag }} --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create git tag
        if: steps.npm.outputs.current == ''
        run: |
          VERSION="${{ steps.pkg.outputs.version }}"
          if ! git rev-parse "v$VERSION" >/dev/null 2>&1; then
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi

      - name: Create GitHub Release
        if: steps.npm.outputs.current == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: "ACC v${{ steps.pkg.outputs.version }}"
          body: |
            ## ACC v${{ steps.pkg.outputs.version }}

            See [CHANGELOG.md](./CHANGELOG.md) for details.

            ### Installation

            ```bash
            npm install -g acc-code-context
            ```

            ### Usage

            ```bash
            acc --version
            acc check  # validates an ACC-enhanced repository
            ```
          draft: false
          prerelease: ${{ steps.pkg.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          if [ -n "${{ steps.npm.outputs.current }}" ]; then
            echo "Nothing to publish — ${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} already exists on npm."
          else
            TAG="${{ steps.pkg.outputs.npm_tag }}"
            PRERELEASE="${{ steps.pkg.outputs.prerelease }}"
            echo "Published ${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} to npm (${TAG})."
            if [ "$PRERELEASE" = "true" ]; then
              echo "Pre-release version — will not be the default npm install target."
            else
              echo "Stable release — this is now the latest version."
            fi
          fi
