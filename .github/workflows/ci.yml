name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Framework CLI — unit + end-to-end tests (zero runtime dependencies)
  # ---------------------------------------------------------------------------
  test-cli:
    name: Test CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: node --test test/*.test.js

  # ---------------------------------------------------------------------------
  # Dogfooding: the CLI validates its own repository
  # ---------------------------------------------------------------------------
  dogfood:
    name: Dogfood (ACC validates ACC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run acc check
        run: node bin/acc.js check --json
      - name: Run acc graph
        run: node bin/acc.js graph --json
      - name: Run acc context
        run: node bin/acc.js context docs --depth 1 --json
      - name: Run acc inspect
        run: node bin/acc.js inspect docs --json
      - name: Run acc discover
        run: node bin/acc.js discover --json

  # ---------------------------------------------------------------------------
  # Determinism: identical JSON output across runs
  # ---------------------------------------------------------------------------
  determinism:
    name: Determinism (JSON output stability)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test determinism - acc context
        run: |
          node bin/acc.js context docs --depth 1 --json > /tmp/run1.json
          node bin/acc.js context docs --depth 1 --json > /tmp/run2.json
          diff /tmp/run1.json /tmp/run2.json
      - name: Test determinism - acc graph
        run: |
          node bin/acc.js graph --json > /tmp/graph1.json
          node bin/acc.js graph --json > /tmp/graph2.json
          diff /tmp/graph1.json /tmp/graph2.json
      - name: Test determinism - acc check
        run: |
          node bin/acc.js check --json > /tmp/check1.json
          node bin/acc.js check --json > /tmp/check2.json
          diff /tmp/check1.json /tmp/check2.json

  # ---------------------------------------------------------------------------
  # JSON schema validation: every --json command emits valid JSON
  # ---------------------------------------------------------------------------
  schema-validation:
    name: JSON Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JSON outputs
        run: |
          for cmd in "check" "graph" "inspect docs" "discover" "dependencies docs" "dependents docs" "impact docs"; do
            node bin/acc.js $cmd --json | jq -e . > /dev/null || { echo "invalid JSON: acc $cmd"; exit 1; }
          done

  # ---------------------------------------------------------------------------
  # Documentation site: builds from the canonical docs/ (single source of truth)
  # ---------------------------------------------------------------------------
  docs:
    name: Docs Site Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: docs
        run: npm install
      - name: Build site
        working-directory: docs
        run: npm run build

  # ---------------------------------------------------------------------------
  # Consistency: all version-bearing manifests and skill copies agree
  # ---------------------------------------------------------------------------
  consistency:
    name: Consistency (versions + skill copies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check manifest versions
        run: npm run check:versions
      - name: Check skill copy consistency
        run: npm run check:skill-copies

  # ---------------------------------------------------------------------------
  # Publish safety: verify only acc-code-context is publishable, docs is private
  # ---------------------------------------------------------------------------
  publish-safety:
    name: Publish Safety (only acc-code-context goes to npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify root package is acc-code-context
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          if [ "$PKG_NAME" != "acc-code-context" ]; then
            echo "::error::Root package name is '$PKG_NAME', expected 'acc-code-context'"
            exit 1
          fi
      - name: Verify docs package is private
        run: |
          DOCS_PRIVATE=$(node -p "require('./docs/package.json').private")
          if [ "$DOCS_PRIVATE" != "true" ]; then
            echo "::error::docs/package.json is not private — accidental publish risk"
            exit 1
          fi
      - name: Verify npm pack only includes bin + lib
        run: |
          FILES=$(node -p "JSON.stringify(require('./package.json').files)")
          if [ "$FILES" != '["bin","lib","skills"]' ]; then
            echo "::error::package.json files field is $FILES, expected [\"bin\",\"lib\",\"skills\"]"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Hard invariant: removing the .acc/ control plane leaves a valid
  # agents.md repository (AGENTS.md hierarchy still parses and checks clean)
  # ---------------------------------------------------------------------------
  invariant:
    name: Hard Invariant (framework survives without ACC tooling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify AGENTS.md hierarchy parses standalone
        run: |
          node -e "
            const { parse } = require('./lib/core/agents.js');
            const fs = require('fs');
            const path = require('path');
            const { walkFiles } = require('./lib/core/util.js');
            const files = walkFiles('.', '.', [], []);
            const agentsFiles = files.filter((f) => path.basename(f).toLowerCase() === 'agents.md');
            if (!agentsFiles.length) { console.error('no AGENTS.md found'); process.exit(1); }
            for (const f of agentsFiles) parse(fs.readFileSync(f, 'utf8'));
            console.log('OK: ' + agentsFiles.length + ' AGENTS.md files parse without ACC tooling');
          "
