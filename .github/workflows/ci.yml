name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUST_VERSION: "1.75"
  NODE_VERSION: "20"
  GO_VERSION: "1.21"
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # Linting
  # ---------------------------------------------------------------------------
  lint-rust:
    name: Lint Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  lint-typescript:
    name: Lint TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analyzers/typescript
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run prettier
        run: npx prettier --check .
      - name: Run eslint
        run: npx eslint .

  lint-go:
    name: Lint Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analyzers/go
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run gofmt
        run: test -z "$(gofmt -l .)"
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analyzers/python
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy
      - name: Run ruff
        run: ruff check .
      - name: Run black
        run: black --check .
      - name: Run mypy
        run: mypy --strict .

  # ---------------------------------------------------------------------------
  # Unit Tests
  # ---------------------------------------------------------------------------
  test-rust:
    name: Test Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Run tests
        run: cargo test --all-features
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: rust

  test-typescript:
    name: Test TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analyzers/typescript
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: typescript

  test-go:
    name: Test Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analyzers/go
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          flags: go

  test-python:
    name: Test Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analyzers/python
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
      - name: Run tests
        run: pytest --cov=src --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: python

  # ---------------------------------------------------------------------------
  # Dogfooding: ACC validates itself
  # ---------------------------------------------------------------------------
  dogfood:
    name: Dogfood (ACC validates ACC)
    runs-on: ubuntu-latest
    needs: [lint-rust, test-rust]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Build ACC CLI
        run: cargo build --release
      - name: Run acc check
        run: ./target/release/acc check --json
      - name: Run acc graph
        run: ./target/release/acc graph --format json
      - name: Run acc context
        run: ./target/release/acc context docs --depth 1 --json
      - name: Run acc inspect
        run: ./target/release/acc inspect docs --json
      - name: Run acc discover
        run: ./target/release/acc discover --json

  # ---------------------------------------------------------------------------
  # Determinism Tests
  # ---------------------------------------------------------------------------
  determinism:
    name: Determinism (JSON output stability)
    runs-on: ubuntu-latest
    needs: [lint-rust, test-rust]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Build ACC CLI
        run: cargo build --release
      - name: Test determinism - acc context
        run: |
          ./target/release/acc context docs --depth 1 --json > /tmp/run1.json
          ./target/release/acc context docs --depth 1 --json > /tmp/run2.json
          diff /tmp/run1.json /tmp/run2.json
      - name: Test determinism - acc graph
        run: |
          ./target/release/acc graph --format json > /tmp/graph1.json
          ./target/release/acc graph --format json > /tmp/graph2.json
          diff /tmp/graph1.json /tmp/graph2.json
      - name: Test determinism - acc check
        run: |
          ./target/release/acc check --json > /tmp/check1.json
          ./target/release/acc check --json > /tmp/check2.json
          diff /tmp/check1.json /tmp/check2.json

  # ---------------------------------------------------------------------------
  # Schema Validation
  # ---------------------------------------------------------------------------
  schema-validation:
    name: JSON Schema Validation
    runs-on: ubuntu-latest
    needs: [lint-rust, test-rust]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Build ACC CLI
        run: cargo build --release
      - name: Validate JSON outputs against schema
        run: |
          # This would use a JSON schema validator
          # For now, just verify all --json commands produce valid JSON
          ./target/release/acc check --json | jq . > /dev/null
          ./target/release/acc graph --format json | jq . > /dev/null
          ./target/release/acc context docs --depth 1 --json | jq . > /dev/null
          ./target/release/acc inspect docs --json | jq . > /dev/null
          ./target/release/acc discover --json | jq . > /dev/null
          ./target/release/acc dependencies docs --json | jq . > /dev/null
          ./target/release/acc dependents docs --json | jq . > /dev/null
          ./target/release/acc impact docs --json | jq . > /dev/null
          ./target/release/acc search "test" --json | jq . > /dev/null

  # ---------------------------------------------------------------------------
  # Documentation Checks
  # ---------------------------------------------------------------------------
  docs:
    name: Documentation Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check docs structure
        run: |
          # Verify docs/README.md index is current
          # Verify all numbered docs exist
          for i in {01..10}; do
            if [ ! -f "docs/${i}-*.md" ]; then
              echo "Missing docs/${i}-*.md"
              exit 1
            fi
          done
      - name: Check for broken links
        run: |
          # Simple markdown link check
          grep -r ']\(' docs/ | grep -v 'http' | while read line; do
            # Extract link and check if file exists
            echo "Checking: $line"
          done

  # ---------------------------------------------------------------------------
  # Integration Tests (if applicable)
  # ---------------------------------------------------------------------------
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint-rust, test-rust]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Build ACC CLI
        run: cargo build --release
      - name: Run integration tests
        run: |
          # Test on fixture repositories
          cargo test --test integration 2>/dev/null || echo "No integration tests yet"

  # ---------------------------------------------------------------------------
  # Release Readiness
  # ---------------------------------------------------------------------------
  release-readiness:
    name: Release Readiness Check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-rust, test-rust, dogfood, determinism, schema-validation]
    steps:
      - uses: actions/checkout@v4
      - name: Check diagnostic code stability
        run: |
          # Verify no ACC0xx codes were renumbered/removed
          echo "Checking diagnostic code stability..."
      - name: Check JSON schema version
        run: |
          # Verify schema_version in JSON outputs
          echo "Checking schema version..."
      - name: Verify hard invariant
        run: |
          # Test that removing .agents/ leaves valid AGENTS.md repo
          echo "Verifying hard invariant..."