name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.1.0)"
        required: true
        type: string
      prerelease:
        description: "Publish as pre-release tag (e.g., beta, rc)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Run tests
        run: node --test test/*.test.js

      - name: Verify version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "${{ github.event.inputs.version }}" ]; then
            echo "package.json version ($PKG_VERSION) does not match release version (${{ github.event.inputs.version }})"
            exit 1
          fi

      - name: Publish to npm
        run: |
          if [ "${{ github.event.inputs.prerelease }}" == "true" ]; then
            npm publish --tag beta
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: ACC v${{ github.event.inputs.version }}
          body: |
            ## ACC v${{ github.event.inputs.version }}

            See [CHANGELOG.md](./CHANGELOG.md) for details.

            ### Installation

            ```bash
            npm install -g acc-agents
            ```

            ### Usage

            ```bash
            acc --version
            acc check  # validates an ACC-enhanced repository
            ```
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
