name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.1.0)"
        required: true
        type: string
      prerelease:
        description: "Publish as pre-release tag (e.g., beta, rc)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # ── Pre-flight checks ──────────────────────────────────────────
      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: node --test test/*.test.js

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF#refs/tags/v}"
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify version matches
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name")
          RELEASE_VERSION="${{ steps.version.outputs.version }}"
          echo "Package: $PKG_NAME@$PKG_VERSION"
          echo "Release: $RELEASE_VERSION"
          if [ "$PKG_VERSION" != "$RELEASE_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match release version ($RELEASE_VERSION)"
            exit 1
          fi

      - name: Verify package name
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          if [ "$PKG_NAME" != "acc-code-context" ]; then
            echo "::error::Unexpected package name '$PKG_NAME' — expected 'acc-code-context'"
            exit 1
          fi

      - name: Check manifest version consistency
        run: npm run check:versions

      - name: Check skill copy consistency
        run: npm run check:skill-copies

      - name: Verify npm authentication
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry-run publish (verify package contents)
        run: npm pack --dry-run

      - name: Check version not already published
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name")
          if npm view "$PKG_NAME@$PKG_VERSION" version 2>/dev/null; then
            echo "::error::$PKG_NAME@$PKG_VERSION already exists on npm"
            exit 1
          fi
          echo "$PKG_NAME@$PKG_VERSION is available"

      - name: Check version is higher than latest on npm
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name")
          LATEST_NPM=$(npm view "$PKG_NAME" version 2>/dev/null || echo "0.0.0")
          echo "Latest on npm: $LATEST_NPM → publishing: $PKG_VERSION"
          # Reject if the new version is LOWER than what's already published
          HIGHER=$(printf '%s\n' "$PKG_VERSION" "$LATEST_NPM" | sort -V | tail -1)
          if [ "$HIGHER" = "$LATEST_NPM" ] && [ "$PKG_VERSION" != "$LATEST_NPM" ]; then
            echo "::error::Version $PKG_VERSION is LOWER than latest on npm ($LATEST_NPM)"
            exit 1
          fi

      # ── Publish ────────────────────────────────────────────────────
      - name: Publish to npm
        run: |
          if [ "${{ github.event.inputs.prerelease }}" == "true" ]; then
            npm publish --tag beta
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── Post-publish ───────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "ACC v${{ steps.version.outputs.version }}"
          body: |
            ## ACC v${{ steps.version.outputs.version }}

            See [CHANGELOG.md](./CHANGELOG.md) for details.

            ### Installation

            ```bash
            npm install -g acc-code-context
            ```

            ### Usage

            ```bash
            acc --version
            acc check  # validates an ACC-enhanced repository
            ```
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
