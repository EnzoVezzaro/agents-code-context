# ACC Control Plane Configuration
#
# This file is optional. When absent, ACC uses sensible defaults and
# every command still works. See docs/03-repository-structure.md.
#
# All keys are optional. Comments explain each option. Only keys ACC
# actually reads are shown here — the implementation ignores unknown
# sections, so the example stays truthful.
#
# Configuration schema version. Increment on breaking changes.
schema_version: 1

# -----------------------------------------------------------------------------
# Language Analyzers
# -----------------------------------------------------------------------------
# Language analyzers improve discovered-edge accuracy by parsing imports.
# When an analyzer is disabled or unavailable, ACC falls back to declared
# edges from AGENTS.md and filesystem structure. Disabling an analyzer
# never breaks the graph — the core is language-agnostic.
#
# Enable only the analyzers relevant to your project to reduce overhead.
language_analyzers:
  rust: true
  typescript: true
  go: true
  python: true
  javascript: true
  # java: false
  # csharp: false
  # cpp: false
  # swift: false
  # kotlin: false
  # ruby: false
  # php: false

# -----------------------------------------------------------------------------
# Ignore Patterns
# -----------------------------------------------------------------------------
# Paths excluded from graph derivation and search. Globs are matched
# relative to the project root. These are in addition to built-in defaults
# (.git/, target/, node_modules/, *.lock, dist/, build/).
ignore:
  - "target/"
  - "node_modules/"
  - "*.lock"
  - ".git/"
  - "dist/"
  - "build/"
  - "coverage/"
  - ".next/"
  - ".nuxt/"
  - "vendor/"
  - "__pycache__/"
  - "*.pyc"
  # VitePress build cache and output — generated bundles would pollute
  # discovered edges with false dependencies.
  - "docs/.vitepress/"
  # Static site assets (favicon, brand images) — no analyzable source;
  # keeps `acc check` quiet about extensions with no language analyzer.
  - "docs/public/"
  # aba/ is its own self-contained repository (acc-battle-arena), never
  # pushed with ACC; excluded so the parent graph stays clean.
  - "aba/"

# -----------------------------------------------------------------------------
# Diagnostic Tuning
# -----------------------------------------------------------------------------
# The canonical severity of a code is fixed by docs/07-diagnostic-codes.md.
# `warn_only` MAY downgrade a code from error to warn for this project only.
# Upgrading above canonical severity is forbidden.
diagnostics:
  # Example: downgrade circular reference warning to info
  # warn_only: ["ACC014"]
  warn_only: []

# -----------------------------------------------------------------------------
# Forbidden Dependencies
# -----------------------------------------------------------------------------
# Dependency rules the repository must never have. Each rule is a
# { from, to } pair (directory prefixes, relative to the project root).
# A declared or discovered edge under both prefixes emits ACC024 (error);
# a rule whose paths exist but never match is inert (ACC025, warn); a
# rule naming a path that does not exist is ACC065 (warn). `acc check`
# and the engine scan honor these rules.
forbidden_deps:
  # - from: "src/auth/"
  #   to: "src/ui/"
  # - from: "src/database/"
  #   to: "src/auth/"

# -----------------------------------------------------------------------------
# Ownership Configuration
# -----------------------------------------------------------------------------
ownership:
  # strict: true → duplicate ownership (ACC030) is an error and fails `acc check`.
  # strict: false → ACC030 is still emitted as an error per the code's canonical
  # severity; this flag only controls whether ACC stops on the first ownership
  # conflict or continues to collect them all.
  strict: false

# -----------------------------------------------------------------------------
# Engine (AI-powered, token-gated)
# -----------------------------------------------------------------------------
# The engine keeps the ACC files in sync with the codebase. Its AI phase
# only runs when the trigger fires — that is the token budget control.
engine:
  trigger:
    # mode: commits | changes | always
    #   commits → count git commits since the last triggered run.
    #   changes → keep a content-hash snapshot and count changed files.
    # The trigger also exposes the changed files, so the AI evaluates the
    # actual code — never just the git log.
    mode: commits
    # How many commits (or changed files) the engine waits for before
    # running the token-consuming AI phase. Default: 3.
    threshold: 3
  supervisor:
    # Second AI pass that scores the engine's proposed changes against
    # ACC rules and compliance (0-100) before anything is written.
    # Below the threshold, the engine iterates on its own proposals with
    # the supervisor's feedback until compliant or max_iterations is hit.
    # Nothing is written to the ACC files without approval.
    enabled: false
    threshold: 85
    max_iterations: 3
  ai:
    # How the engine's AI phase handles failing providers:
    #   retries → attempts per provider call before giving up on it.
    #   fallback → when one provider fails, try the next configured one.
    #   retry_delay_ms → pause between attempts.
    #   max_consecutive_failures → `acc engine --watch` stops with a
    #     clear error after this many consecutive runs where every
    #     provider was exhausted (fix the api keys and restart).
    retries: 3
    retry_delay_ms: 1000
    fallback: true
    max_consecutive_failures: 3

# -----------------------------------------------------------------------------
# AI Providers (optional, AI SDK v5)
# -----------------------------------------------------------------------------
# Explicit opt-in: with enabled: false nothing loads, nothing runs, and
# no network call ever happens at config/graph/scan time. Providers are
# only contacted by commands that explicitly request a model
# (`acc engine`, `acc ai`). API keys are read from the environment
# (api_key_env), never stored in the repository. `base_url` overrides
# the endpoint — useful for OpenAI-compatible gateways (NVIDIA, OpenRouter,
# self-hosted). See docs/05-cli-commands.md (acc ai).
ai:
  enabled: false
  # default: main   # provider id used when none is passed
  # providers:
    # - id: main
    #   provider: openai
    #   model: gpt-4o
    #   api_key_env: OPENAI_API_KEY
    # - id: nvidia
    #   provider: openai            # OpenAI-compatible endpoint
    #   model: nvidia/nemotron-3-nano-30b-a3b
    #   api_key_env: NVIDIA_API_KEY
    #   base_url: https://integrate.api.nvidia.com/v1
    # - id: gemini
    #   provider: google
    #   model: gemini-2.0-flash
    #   api_key_env: GEMINI_API_KEY
    # - id: openrouter
    #   provider: openai            # OpenAI-compatible endpoint
    #   model: nvidia/nemotron-3-nano-30b-a3b:free
    #   api_key_env: OPENROUTER_API_KEY
    #   base_url: https://openrouter.ai/api/v1

# -----------------------------------------------------------------------------
# Multi-Agent Orchestration
# -----------------------------------------------------------------------------
# When enabled, the active coding agent MAY create and coordinate additional
# agents to complete a task. See docs/11-multi-agent-orchestration.md.
multi_agent:
  # Master switch. When false, no multi-agent orchestration occurs.
  enabled: false

  # Maximum number of concurrent workers.
  max_concurrency: 4

  # Maximum recursive spawning depth (0 = no recursion).
  max_depth: 1

  # Per-worker task timeout in seconds.
  task_timeout: 300

  # Resource limits for multi-agent sessions.
  resource_limits:
    # Maximum CPU utilization percentage.
    cpu_percent: 80
    # Maximum memory in MB.
    memory_mb: 4096
    # Token/budget limit (if applicable to the agent).
    token_budget: 1000000

  # Isolation mode for parallel work.
  # Options: "git_worktree", "branch", "directory", "snapshot", "process"
  isolation_mode: "git_worktree"

  # Conflict resolution policy when workers touch overlapping scopes.
  # Options: "sequentialize", "reassign", "merge", "discard", "ask_user"
  conflict_policy: "sequentialize"

# -----------------------------------------------------------------------------
# Context Engine Defaults
# -----------------------------------------------------------------------------
# Defaults for `acc context` command. Can be overridden per-invocation.
context:
  # Default depth for transitive contract expansion.
  default_depth: 1
  # Default output budget in bytes.
  default_max_bytes: 65536
  # Default sections to include (others excluded unless --include used).
  default_include:
    - "hierarchy"
    - "contract"
    - "dependencies"
    - "constraints"
    - "implementations"
  # Memory excluded by default; use --include memory to include.

# -----------------------------------------------------------------------------
# Graph Defaults
# -----------------------------------------------------------------------------
graph:
  # Default output format: text, mermaid, dot, json
  default_format: "json"
  # Include provenance by default in text output
  default_provenance: true

# -----------------------------------------------------------------------------
# Memory Defaults
# -----------------------------------------------------------------------------
# Defaults for `.acc-memory.md` handling — honored by `acc memory` and
# `acc check` (ACC054 when a file exceeds the threshold).
memory:
  # Warn (ACC054) when a memory file exceeds this many bytes.
  warn_bytes: 65536
  # Timestamp format for `acc memory add` entries: rfc3339 | date.
  timestamp_format: "rfc3339"

# -----------------------------------------------------------------------------
# Discovery Defaults
# -----------------------------------------------------------------------------
# Default suggestion kinds for `acc discover` when --kind is not passed.
# The engine's sync plan deliberately uses its own additive-only kinds
# (missing-contract, missing-dependency, orphan-code) as a safety
# invariant — it never auto-removes declared facts.
discover:
  default_kinds:
    - "missing-contract"
    - "missing-dependency"
    - "stale-dependency"
    - "unknown-owner"
    - "orphan-code"

# -----------------------------------------------------------------------------
# Tooling Subsystem
# -----------------------------------------------------------------------------
# Automatic, deterministic, project-aware tool listing for `acc tools`.
# Only the keys read by the implementation are listed (no execution model:
# ACC never runs project code — see docs/13-security.md).
tools:
  # Master switch for auto-discovery of project tools (package.json scripts,
  # Cargo.toml, etc. — listed as `detected` in the manifest).
  auto_discover: true

  # Plugin listing (from .acc/config/tools/)
  plugins:
    enabled: true
    directory: ".acc/config/tools"
